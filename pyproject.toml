[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citizens-online"
version = "0.1.0-alpha.1"
description = "Nextcloud ExApp for running online deliberations in Talk breakout rooms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
# Upper bounds keep a rebuild of a released tag reproducible.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "nc_py_api>=0.30,<0.32",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<26",
    "websockets>=13,<16",
    "cryptography>=42,<47",
    "fpdf2>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
# namespace variant: citizens_online/db/migrations has no __init__.py (it is an
# Alembic script directory, not an import package) but must still ship, or a
# wheel install has no migrations to run at startup
include = ["citizens_online*"]
namespaces = true

[tool.setuptools.package-data]
"citizens_online.db.migrations" = ["env.py", "*.mako", "versions/*.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
